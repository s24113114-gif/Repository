<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>微型記帳本 SPA</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f7f6; padding: 20px; display: flex; justify-content: center; }
    .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 450px; }
    input, select, button { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
    button { background: #5c6bc0; color: white; border: none; cursor: pointer; font-size: 16px; }
    button:hover { background: #3f51b5; }
    .btn-group { display: flex; gap: 10px; }
    .hidden { display: none; }
    .summary-box { display: flex; justify-content: space-between; background: #e8eaf6; padding: 15px; border-radius: 5px; font-weight: bold; margin: 15px 0; font-size: 14px; }
    .record-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #eee; }
    .record-item .delete-btn { width: auto; background: #ef5350; margin: 0; padding: 5px 10px; font-size: 12px; }
    .income { color: #4caf50; }
    .expense { color: #f44336; }
  </style>
</head>
<body>

  <div class="card">
    <div id="authBlock">
      <h2>微型記帳本 - 會員系統</h2>
      <input type="text" id="username" placeholder="請輸入帳號">
      <input type="password" id="password" placeholder="請輸入密碼">
      <div class="btn-group">
        <button id="registerBtn">註冊</button>
        <button id="loginBtn">登入</button>
      </div>
    </div>

    <div id="mainBlock" class="hidden">
      <h2>歡迎，<span id="userDisplay"></span>! <button id="logoutBtn" style="width:auto; padding:5px 10px; float:right; font-size:12px; background:#777;">登出</button></h2>
      
      <form id="recordForm">
        <select id="recordType">
          <option value="expense">支出</option>
          <option value="income">收入</option>
        </select>
        
        <select id="recordCategory">
          <option value="餐飲">餐飲</option>
          <option value="交通">交通</option>
          <option value="娛樂">娛樂</option>
          <option value="薪資">薪資</option>
          <option value="其他">其他</option>
        </select>
        
        <input type="number" id="recordAmount" placeholder="金額" required>
        <input type="text" id="recordDesc" placeholder="備註描述">
        <button type="submit">新增帳目</button>
      </form>

      <div class="summary-box">
        <div>總收入: <span id="totalIncome" class="income">$0</span></div>
        <div>總支出: <span id="totalExpense" class="expense">$0</span></div>
        <div>資產剩餘: <span id="totalBalance">$0</span></div>
      </div>

      <h3>您的記帳歷史</h3>
      <div id="recordList"></div>
    </div>
  </div>

  <script>
    // ！！！請將此網址替換為你在 Render 部署成功的後端網址 ！！！
    const API_BASE = 'https://repository-5mi9.onrender.com/api';

    // 介面切換邏輯
    function checkAuth() {
      const token = localStorage.getItem('token');
      const username = localStorage.getItem('username');
      if (token && username) {
        document.getElementById('authBlock').classList.add('hidden');
        document.getElementById('mainBlock').classList.remove('hidden');
        document.getElementById('userDisplay').innerText = username;
        fetchRecords(); // 局部刷新資料
      } else {
        document.getElementById('authBlock').classList.remove('hidden');
        document.getElementById('mainBlock').classList.add('hidden');
      }
    }

    // 處理 API 錯誤響應 (防禦性解析，防止 404/500 噴 HTML 導致崩潰)
    async function handleResponse(response) {
      const contentType = response.headers.get("content-type");
      if (contentType && contentType.indexOf("application/json") !== -1) {
        return await response.json();
      } else {
        const text = await response.text();
        throw new Error(text || `伺服器回傳狀態碼: ${response.status}`);
      }
    }

    // 【評分標準 1-1 & 加分項】：註冊事件
    document.getElementById('registerBtn').addEventListener('click', async () => {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      if(!username) return alert('請輸入帳號');
      
      // 【+5分挑戰】：前端限制密碼少於 6 個字跳出警告並阻擋
      if (password.length < 6) {
        alert('密碼長度不能少於 6 個字！');
        return;
      }

      try {
        const res = await fetch(`${API_BASE}/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await handleResponse(res);
        if (res.ok) {
          alert('註冊成功！請點擊登入。');
        } else {
          alert('註冊失敗：' + data.message);
        }
      } catch (err) {
        alert('錯誤：' + err.message);
      }
    });

    // 登入事件
    document.getElementById('loginBtn').addEventListener('click', async () => {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res = await fetch(`${API_BASE}/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await handleResponse(res);
        if (res.ok) {
          localStorage.setItem('token', data.token);
          localStorage.setItem('username', data.username);
          checkAuth();
        } else {
          alert('登入失敗：' + data.message);
        }
      } catch (err) {
        alert('錯誤：' + err.message);
      }
    });

    // 登出事件
    document.getElementById('logoutBtn').addEventListener('click', () => {
      localStorage.removeItem('token');
      localStorage.removeItem('username');
      checkAuth();
    });

    // 【評分標準 1-3 & 1-4 & 加分項】：拉取帳目並進行 SPA 局部渲染與自動計算
    async function fetchRecords() {
      const token = localStorage.getItem('token');
      try {
        const res = await fetch(`${API_BASE}/accounts`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        
        // 【評分標準 1-2】：若收到後端 401，精準彈出警告並踢回登入頁
        if (res.status === 401) {
          alert('未登入或驗證已過期，請重新登入！(401)');
          localStorage.clear();
          checkAuth();
          return;
        }

        const records = await handleResponse(res);
        
        let totalIncome = 0;
        let totalExpense = 0;
        const listContainer = document.getElementById('recordList');
        listContainer.innerHTML = ''; // 清空舊列表，實現不閃爍更新

        records.forEach(item => {
          if (item.type === 'income') totalIncome += item.amount;
          if (item.type === 'expense') totalExpense += item.amount;

          const div = document.createElement('div');
          div.className = 'record-item';
          div.innerHTML = `
            <div>
              <span class="${item.type}">[${item.type === 'income' ? '收入' : '支出'}-${item.category}]</span> 
              <strong>$${item.amount}</strong> - ${item.description || '無備註'}
            </div>
            <button class="delete-btn" onclick="deleteRecord('${item._id}')">刪除</button>
          `;
          listContainer.appendChild(div);
        });

        // 【+5分挑戰】：自動計算並顯示總收入、總支出與剩餘餘額
        document.getElementById('totalIncome').innerText = `$${totalIncome}`;
        document.getElementById('totalExpense').innerText = `$${totalExpense}`;
        document.getElementById('totalBalance').innerText = `$${totalIncome - totalExpense}`;
        
      } catch (err) {
        console.error(err);
      }
    }

    // 【評分標準 1-4】：新增帳目 (SPA 局部非同步更新)
    document.getElementById('recordForm').addEventListener('submit', async (e) => {
      e.preventDefault(); // 阻止表單預設的整頁刷新的行為
      const token = localStorage.getItem('token');
      
      const type = document.getElementById('recordType').value;
      const category = document.getElementById('recordCategory').value;
      const amount = document.getElementById('recordAmount').value;
      const description = document.getElementById('recordDesc').value;

      try {
        const res = await fetch(`${API_BASE}/accounts`, {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ type, category, amount, description })
        });
        
        if (res.ok) {
          document.getElementById('recordForm').reset(); // 僅重置欄位
          fetchRecords(); // 局部刷新資料列表，網頁不白掉、不重載
        } else {
          const data = await handleResponse(res);
          alert('新增失敗：' + data.message);
        }
      } catch (err) {
        alert('錯誤：' + err.message);
      }
    });

    // 【評分標準 1-4】：刪除帳目 (SPA 局部非同步更新)
    async function deleteRecord(id) {
      if(!confirm('確定要刪除這筆帳目嗎？')) return;
      const token = localStorage.getItem('token');
      
      try {
        const res = await fetch(`${API_BASE}/accounts/${id}`, {
          method: 'DELETE',
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (res.ok) {
          fetchRecords(); // 刪除成功後，局部刷新列表
        } else {
          const data = await handleResponse(res);
          alert('刪除失敗：' + data.message);
        }
      } catch (err) {
        alert('錯誤：' + err.message);
      }
    }

    // 網頁開啟時初始化檢查
    checkAuth();
  </script>
</body>
</html>
